<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Pocket AI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #f0f0f0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    #header {
      padding: 16px 20px 12px;
      padding-top: calc(16px + env(safe-area-inset-top));
      border-bottom: 0.5px solid #222;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      background: #111;
    }

    #dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #555;
      flex-shrink: 0;
      transition: background 0.4s;
    }
    #dot.ready { background: #1D9E75; box-shadow: 0 0 6px #1D9E7588; }

    #header-text { flex: 1; }
    #header-title { font-size: 15px; font-weight: 600; color: #f0f0f0; }
    #status {
      font-size: 11px;
      color: #666;
      margin-top: 1px;
      transition: color 0.3s;
    }
    #status.ready { color: #1D9E75; }

    /* Progress bar */
    #progress-wrap {
      height: 2px;
      background: #1a1a1a;
      flex-shrink: 0;
      overflow: hidden;
    }
    #progress-bar {
      height: 100%;
      width: 0%;
      background: #1D9E75;
      transition: width 0.3s ease;
    }

    /* Messages */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      -webkit-overflow-scrolling: touch;
    }

    .msg-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .msg-wrap.user { align-items: flex-end; }
    .msg-wrap.assistant { align-items: flex-start; }

    .msg-label {
      font-size: 10px;
      color: #444;
      padding: 0 4px;
      letter-spacing: 0.04em;
    }

    .bubble {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.5;
      word-break: break-word;
    }

    .msg-wrap.user .bubble {
      background: #1D9E75;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg-wrap.assistant .bubble {
      background: #1c1c1c;
      color: #e8e8e8;
      border: 0.5px solid #2a2a2a;
      border-bottom-left-radius: 4px;
    }

    /* Typing indicator */
    .typing {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 4px 0;
    }
    .typing-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #555;
      animation: pulse 1.2s infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse { 0%,80%,100%{opacity:0.3} 40%{opacity:1} }

    /* Input bar */
    #input-bar {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 12px 16px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      border-top: 0.5px solid #1e1e1e;
      background: #111;
      flex-shrink: 0;
    }

    #input {
      flex: 1;
      background: #1c1c1c;
      border: 0.5px solid #2e2e2e;
      border-radius: 22px;
      padding: 10px 16px;
      font-size: 15px;
      color: #f0f0f0;
      outline: none;
      resize: none;
      max-height: 120px;
      min-height: 42px;
      line-height: 1.4;
      -webkit-appearance: none;
      font-family: inherit;
    }
    #input::placeholder { color: #444; }
    #input:focus { border-color: #2D9E75; }
    #input:disabled { opacity: 0.4; }

    #send {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #1D9E75;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.2s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    #send:disabled { opacity: 0.3; cursor: not-allowed; }
    #send:active:not(:disabled) { transform: scale(0.92); }
    #send svg { display: block; }

    /* Welcome message */
    #welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 10px;
      color: #333;
      text-align: center;
      padding: 40px 20px;
      pointer-events: none;
      user-select: none;
    }
    #welcome .icon { font-size: 40px; opacity: 0.4; }
    #welcome p { font-size: 14px; color: #3a3a3a; max-width: 240px; line-height: 1.6; }
  </style>
</head>
<body>

<div id="header">
  <div id="dot"></div>
  <div id="header-text">
    <div id="header-title">Pocket AI</div>
    <div id="status">Starting up...</div>
  </div>
</div>

<div id="progress-wrap">
  <div id="progress-bar"></div>
</div>

<div id="messages">
  <div id="welcome">
    <div class="icon">◎</div>
    <p>Loading your on-device AI.<br>This takes ~30 seconds on first run.</p>
  </div>
</div>

<div id="input-bar">
  <textarea
    id="input"
    placeholder="Ask anything..."
    disabled
    rows="1"
    onkeydown="handleKey(event)"
    oninput="autoResize(this)"
  ></textarea>
  <button id="send" onclick="chat()" disabled>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
    </svg>
  </button>
</div>

<script type="module">
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers';

env.allowLocalModels = false;
env.useBrowserCache = true;

const MODEL = 'onnx-community/Qwen2.5-0.5B-Instruct';
const history = [];
let generator;

const statusEl  = document.getElementById('status');
const dotEl     = document.getElementById('dot');
const progressEl= document.getElementById('progress-bar');
const inputEl   = document.getElementById('input');
const sendEl    = document.getElementById('send');
const msgsEl    = document.getElementById('messages');
const welcomeEl = document.getElementById('welcome');

async function loadModel() {
  setStatus('Downloading model... 0%', false);

  try {
    generator = await pipeline('text-generation', MODEL, {
      device: 'webgpu',
      dtype: 'q4',
      progress_callback: (p) => {
        if (p.status === 'progress') {
          const pct = Math.round(p.progress);
          progressEl.style.width = pct + '%';
          setStatus(`Downloading model... ${pct}%`, false);
        }
        if (p.status === 'done') {
          progressEl.style.width = '100%';
        }
      }
    });

    progressEl.style.transition = 'opacity 0.5s';
    setTimeout(() => progressEl.style.opacity = '0', 800);

    setStatus('Ready · Metal GPU · on-device', true);
    dotEl.classList.add('ready');
    inputEl.disabled = false;
    sendEl.disabled = false;
    welcomeEl.style.display = 'none';
    addMsg('assistant', 'Hello! I\'m running entirely on your iPhone — no internet needed after this setup. What would you like to talk about?');
    inputEl.focus();

  } catch (err) {
    setStatus('Error: ' + (err.message || 'failed to load model'), false);
    console.error(err);
  }
}

function setStatus(text, isReady) {
  statusEl.textContent = text;
  statusEl.className = isReady ? 'ready' : '';
}

window.chat = async function() {
  const text = inputEl.value.trim();
  if (!text || !generator || sendEl.disabled) return;

  inputEl.value = '';
  autoResize(inputEl);
  sendEl.disabled = true;
  inputEl.disabled = true;

  history.push({ role: 'user', content: text });
  addMsg('user', text);

  const thinkingBubble = addMsg('assistant', null);
  thinkingBubble.innerHTML = '<div class="typing"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';

  try {
    const output = await generator(history, {
      max_new_tokens: 256,
      do_sample: true,
      temperature: 0.7,
      callback_function: (tokens) => {
        const partial = tokens[0].generated_text.at(-1).content;
        thinkingBubble.textContent = partial;
        msgsEl.scrollTop = msgsEl.scrollHeight;
      }
    });

    const reply = output[0].generated_text.at(-1).content;
    history.push({ role: 'assistant', content: reply });
    thinkingBubble.textContent = reply;
  } catch (err) {
    thinkingBubble.textContent = 'Something went wrong. Try again.';
    console.error(err);
  }

  msgsEl.scrollTop = msgsEl.scrollHeight;
  sendEl.disabled = false;
  inputEl.disabled = false;
  inputEl.focus();
};

function addMsg(role, text) {
  const wrap = document.createElement('div');
  wrap.className = `msg-wrap ${role}`;
  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = role === 'user' ? 'You' : 'Pocket AI';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (text) bubble.textContent = text;
  wrap.appendChild(label);
  wrap.appendChild(bubble);
  msgsEl.appendChild(wrap);
  msgsEl.scrollTop = msgsEl.scrollHeight;
  return bubble;
}

window.handleKey = function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    chat();
  }
};

window.autoResize = function(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
};

loadModel();
</script>
</body>
</html>
